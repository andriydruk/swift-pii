name: CI

on:
  push:
    # ci/** so a guard can be validated by deliberately breaking it on a
    # branch -- a sanitizer job that has only ever seen correct code proves
    # nothing about whether it would catch the bug.
    branches: [main, 'ci/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The supported platform. This job is the gate.
  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Portability lint
        run: ./Tools/check_portability.sh

      - name: Build
        run: swift build -v

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee default.log

      - name: Assert the default build is the portable kernel
        # The whole point of PresidioAccelerate being a trait is that a default
        # build runs the same arithmetic everywhere. If it ever became a default
        # trait, every suite here would still pass -- while silently testing a
        # different kernel from the one Linux and Android get.
        run: |
          grep -q "matrix kernel: portable SIMD" default.log \
            || { echo "::error::default build is not using the portable kernel"; exit 1; }

      - name: Build with the Accelerate trait
        # Compile-checks the opt-in path on every push. The parity job below
        # actually runs it, but that job needs a model download first, and a
        # trait that no longer compiles should fail faster than that.
        run: swift build --traits PresidioAccelerate

  # Regenerating the corpus must be reproducible. If upstream Presidio changes
  # shape, this fails here rather than silently shrinking coverage later.
  corpus:
    name: Conformance corpus is reproducible
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check out upstream Presidio
        uses: actions/checkout@v4
        with:
          repository: data-privacy-stack/presidio
          path: .upstream-presidio
          fetch-depth: 1

      - name: Re-extract fixtures
        run: |
          python3 Tools/extract_fixtures.py \
            --presidio .upstream-presidio \
            --out /tmp/regenerated.json

      - name: Compare case counts against the committed corpus
        run: |
          python3 - <<'PY'
          import json, sys

          def load(path):
              with open(path) as fh:
                  return json.load(fh)

          committed = load("Tests/PresidioConformance/Fixtures/recognizer_cases.json")
          fresh = load("/tmp/regenerated.json")

          def count(d):
              return sum(len(t["cases"]) for t in d["tables"])

          c, f = count(committed), count(fresh)
          print(f"committed={c} regenerated={f}")

          # Upstream adding tests is fine and expected. Losing them is not:
          # a drop means either the extractor regressed or upstream removed
          # coverage, and both need a human to look.
          if f < c:
              print(f"::error::regenerated corpus lost {c - f} cases", file=sys.stderr)
              sys.exit(1)
          if f > c:
              print(f"::notice::upstream gained {f - c} cases; refresh the corpus")
          PY

  # The NER suite is gated on SPACY_MODEL_DIR, so for a long time it ran
  # nowhere: not locally by default, and never in CI. Parity was a number in
  # the README that nothing checked. It needs the exact model the gold corpus
  # was built from -- a different patch release has different weights and
  # scores ~62% against it, which looks like a catastrophic regression and is
  # not one.
  #
  # Release, not debug. The model forward pass is a matrix multiply, and a
  # tight numeric loop is the pathological case for an unoptimised build: no
  # inlining, bounds checks on every element, and SIMD types that never become
  # vector instructions. Measured on this model, 100 inferences take 15.4s in
  # debug and 0.061s in release, a factor of 253. Model *loading* is only 18x,
  # so it really is the arithmetic. That difference is what made running these
  # suites in CI look unaffordable when it costs seconds.
  #
  # Both kernels, against the same gold corpora. `PresidioAccelerate` is opt-in
  # precisely because it changes the arithmetic, and an opt-in path that CI
  # never runs is a path whose users are the ones who find out. Neither column
  # is allowed to ship unverified, so this is a matrix rather than one job plus
  # a claim.
  ner-parity:
    name: NER, tagger and lemma parity (${{ matrix.kernel.label }})
    runs-on: macos-15
    strategy:
      # Not fail-fast: when the two kernels disagree, the interesting
      # information is which one broke, and cancelling the other hides it.
      fail-fast: false
      matrix:
        kernel:
          - label: portable SIMD
            flags: ""
            marker: "matrix kernel: portable SIMD"
          - label: Accelerate
            flags: "--traits PresidioAccelerate"
            marker: "matrix kernel: Accelerate (cblas_sgemm)"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch en_core_web_sm 3.7.1
        run: |
          curl -sSL -o model.whl \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl
          unzip -q model.whl -d model
          echo "SPACY_MODEL_DIR=$PWD/model/en_core_web_sm/en_core_web_sm-3.7.1" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -o pipefail
          swift test -c release ${{ matrix.kernel.flags }} \
            --filter "NERTests|TaggerTests|RuleLemmatizerTests|MatrixKernelTests" 2>&1 | tee ner.log

      - name: Assert the expected kernel was compiled in
        # Without this, a typo in the trait name would leave this column running
        # the portable kernel and reporting a pass -- two identical jobs wearing
        # different names, which is worse than not having the second one.
        run: |
          grep -qF "${{ matrix.kernel.marker }}" ner.log \
            || { echo "::error::expected '${{ matrix.kernel.marker }}'"; exit 1; }

      - name: Assert the suite actually ran
        # A --filter that matches nothing exits 0. Without this, deleting the
        # suite or mistyping the filter would look like a pass -- which is
        # exactly how the gap this job closes went unnoticed.
        run: |
          grep -qE "Test run with [1-9][0-9]* test" ner.log \
            || { echo "::error::NER suite did not run"; exit 1; }
          grep -q "spaCy NER parity" ner.log \
            || { echo "::error::NER parity suite was skipped"; exit 1; }
          grep -q "spaCy tagger parity" ner.log \
            || { echo "::error::tagger parity suite was skipped"; exit 1; }
          grep -q "spaCy POS and lemma parity" ner.log \
            || { echo "::error::lemma parity suite was skipped"; exit 1; }

  # ThreadSanitizer cannot load on the macOS dev host (Xcode's sanitizer
  # dylib fails the platform code-signature policy), so the race check lives
  # here. Scoped to the concurrency suite to keep it quick.
  thread-sanitizer:
    name: ThreadSanitizer (concurrency suite)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Test under TSan
        run: swift test --sanitize=thread --filter ConcurrencyTests

  # Not a supported target yet -- a canary. PresidioCore is stdlib-only, so it
  # should build and pass on Linux from day one. Catching portability drift the
  # week it lands is far cheaper than discovering it during the Android port.
  linux-canary:
    name: Linux canary (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Build with the Accelerate trait
        # The trait is documented as inert off Apple platforms. "Inert" is a
        # claim about a `canImport` that nobody here can evaluate by reading it,
        # so it gets built: enabling it on Linux must still produce the portable
        # kernel rather than a compile error.
        run: swift build --traits PresidioAccelerate

      - name: Test
        run: swift test
