name: CI

on:
  push:
    # ci/** so a guard can be validated by deliberately breaking it on a
    # branch -- a sanitizer job that has only ever seen correct code proves
    # nothing about whether it would catch the bug.
    branches: [main, 'ci/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The supported platform. This job is the gate.
  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Portability lint
        run: ./Tools/check_portability.sh

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

  # Regenerating the corpus must be reproducible. If upstream Presidio changes
  # shape, this fails here rather than silently shrinking coverage later.
  corpus:
    name: Conformance corpus is reproducible
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check out upstream Presidio
        uses: actions/checkout@v4
        with:
          repository: data-privacy-stack/presidio
          path: .upstream-presidio
          fetch-depth: 1

      - name: Re-extract fixtures
        run: |
          python3 Tools/extract_fixtures.py \
            --presidio .upstream-presidio \
            --out /tmp/regenerated.json

      - name: Compare case counts against the committed corpus
        run: |
          python3 - <<'PY'
          import json, sys

          def load(path):
              with open(path) as fh:
                  return json.load(fh)

          committed = load("Tests/PresidioConformance/Fixtures/recognizer_cases.json")
          fresh = load("/tmp/regenerated.json")

          def count(d):
              return sum(len(t["cases"]) for t in d["tables"])

          c, f = count(committed), count(fresh)
          print(f"committed={c} regenerated={f}")

          # Upstream adding tests is fine and expected. Losing them is not:
          # a drop means either the extractor regressed or upstream removed
          # coverage, and both need a human to look.
          if f < c:
              print(f"::error::regenerated corpus lost {c - f} cases", file=sys.stderr)
              sys.exit(1)
          if f > c:
              print(f"::notice::upstream gained {f - c} cases; refresh the corpus")
          PY

  # The NER suite is gated on SPACY_MODEL_DIR, so for a long time it ran
  # nowhere: not locally by default, and never in CI. Parity was a number in
  # the README that nothing checked. It needs the exact model the gold corpus
  # was built from -- a different patch release has different weights and
  # scores ~62% against it, which looks like a catastrophic regression and is
  # not one.
  #
  # Release, not debug: the hand-written SIMD GEMM is 200x slower unoptimised
  # (477s vs 2s), which is what made this look too expensive for CI.
  ner-parity:
    name: NER and tagger parity (release)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch en_core_web_sm 3.7.1
        run: |
          curl -sSL -o model.whl \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl
          unzip -q model.whl -d model
          echo "SPACY_MODEL_DIR=$PWD/model/en_core_web_sm/en_core_web_sm-3.7.1" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -o pipefail
          swift test -c release --filter "NERTests|TaggerTests" 2>&1 | tee ner.log

      - name: Assert the suite actually ran
        # A --filter that matches nothing exits 0. Without this, deleting the
        # suite or mistyping the filter would look like a pass -- which is
        # exactly how the gap this job closes went unnoticed.
        run: |
          grep -qE "Test run with [1-9][0-9]* test" ner.log \
            || { echo "::error::NER suite did not run"; exit 1; }
          grep -q "spaCy NER parity" ner.log \
            || { echo "::error::NER parity suite was skipped"; exit 1; }
          grep -q "spaCy tagger parity" ner.log \
            || { echo "::error::tagger parity suite was skipped"; exit 1; }

  # ThreadSanitizer cannot load on the macOS dev host (Xcode's sanitizer
  # dylib fails the platform code-signature policy), so the race check lives
  # here. Scoped to the concurrency suite to keep it quick.
  thread-sanitizer:
    name: ThreadSanitizer (concurrency suite)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Test under TSan
        run: swift test --sanitize=thread --filter ConcurrencyTests

  # Not a supported target yet -- a canary. PresidioCore is stdlib-only, so it
  # should build and pass on Linux from day one. Catching portability drift the
  # week it lands is far cheaper than discovering it during the Android port.
  linux-canary:
    name: Linux canary (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test
