name: CI

on:
  push:
    # ci/** so a guard can be validated by deliberately breaking it on a
    # branch -- a sanitizer job that has only ever seen correct code proves
    # nothing about whether it would catch the bug.
    branches: [main, 'ci/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The supported platform. This job is the gate.
  macos:
    name: macOS (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Portability lint
        run: ./Tools/check_portability.sh

      - name: Build
        run: swift build -v

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee default.log

      - name: Assert the default build on Apple is the Accelerate kernel
        # PresidioAccelerate is a default trait, so this is what an unconfigured
        # consumer on macOS actually gets. If the trait were dropped or renamed,
        # every suite here would still pass while quietly testing something
        # nobody ships.
        run: |
          grep -q "matrix kernel: Accelerate (cblas_sgemm)" default.log \
            || { echo "::error::default macOS build is not using Accelerate"; exit 1; }

      - name: Build with the trait disabled
        # Compile-checks the opt-out on every push. The parity job below runs it
        # properly, but that job downloads a model first, and a portable path
        # that no longer compiles should fail faster than that.
        run: swift build --disable-default-traits

  # Regenerating the corpus must be reproducible. If upstream Presidio changes
  # shape, this fails here rather than silently shrinking coverage later.
  corpus:
    name: Conformance corpus is reproducible
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check out upstream Presidio
        uses: actions/checkout@v4
        with:
          repository: data-privacy-stack/presidio
          path: .upstream-presidio
          fetch-depth: 1

      - name: Re-extract fixtures
        run: |
          python3 Tools/extract_fixtures.py \
            --presidio .upstream-presidio \
            --out /tmp/regenerated.json

      - name: Compare case counts against the committed corpus
        run: |
          python3 - <<'PY'
          import json, sys

          def load(path):
              with open(path) as fh:
                  return json.load(fh)

          committed = load("Tests/PresidioConformance/Fixtures/recognizer_cases.json")
          fresh = load("/tmp/regenerated.json")

          def count(d):
              return sum(len(t["cases"]) for t in d["tables"])

          c, f = count(committed), count(fresh)
          print(f"committed={c} regenerated={f}")

          # Upstream adding tests is fine and expected. Losing them is not:
          # a drop means either the extractor regressed or upstream removed
          # coverage, and both need a human to look.
          if f < c:
              print(f"::error::regenerated corpus lost {c - f} cases", file=sys.stderr)
              sys.exit(1)
          if f > c:
              print(f"::notice::upstream gained {f - c} cases; refresh the corpus")
          PY

      - name: Re-derive the per-language registry oracle
        # `registry_gold.json` records which recognizers upstream loads for each
        # targeted language, and it is the only thing standing between us and
        # the bug it was written for: an entry that declares no
        # `supported_languages` must be built for *every* requested language.
        # A stale oracle would keep asserting yesterday's answer, so it is
        # re-derived from upstream's own loader on every push.
        run: |
          python3 -m venv /tmp/oracle-venv
          /tmp/oracle-venv/bin/pip -q install ./.upstream-presidio/presidio-analyzer
          python3 Tools/registry_reference.py \
            --python /tmp/oracle-venv/bin/python \
            --out /tmp/registry_regenerated.json

      - name: Compare the registry oracle against the committed one
        run: |
          python3 - <<'PY'
          import json, sys

          committed = json.load(open("Tests/PresidioConformance/Fixtures/registry_gold.json"))
          fresh = json.load(open("/tmp/registry_regenerated.json"))

          failed = False
          for language in sorted(set(committed["languages"]) | set(fresh["languages"])):
              was = {r["name"] for r in committed["languages"].get(language, [])}
              now = {r["name"] for r in fresh["languages"].get(language, [])}
              if was == now:
                  continue
              # Upstream changing which recognizers a language gets is news
              # either way -- a gain means we are under-reporting PII in that
              # language, a loss means we are over-reporting.
              print(f"::error::{language}: upstream now loads "
                    f"+{sorted(now - was)} -{sorted(was - now)}", file=sys.stderr)
              failed = True

          sys.exit(1 if failed else 0)
          PY

  # The NER suite is gated on SPACY_MODEL_DIR, so for a long time it ran
  # nowhere: not locally by default, and never in CI. Parity was a number in
  # the README that nothing checked. It needs the exact model the gold corpus
  # was built from -- a different patch release has different weights and
  # scores ~62% against it, which looks like a catastrophic regression and is
  # not one.
  #
  # Release, not debug. The model forward pass is a matrix multiply, and a
  # tight numeric loop is the pathological case for an unoptimised build: no
  # inlining, bounds checks on every element, and SIMD types that never become
  # vector instructions. Measured on this model, 100 inferences take 15.4s in
  # debug and 0.061s in release, a factor of 253. Model *loading* is only 18x,
  # so it really is the arithmetic. That difference is what made running these
  # suites in CI look unaffordable when it costs seconds.
  #
  # Both kernels, against the same gold corpora. `PresidioAccelerate` is on by
  # default, so the Accelerate column is what Apple-platform users get and the
  # portable column is what everyone else gets -- two shipped configurations,
  # neither allowed to go unverified. Hence a matrix rather than one job plus a
  # claim about the other.
  ner-parity:
    name: NER, tagger and lemma parity (${{ matrix.kernel.label }})
    runs-on: macos-15
    strategy:
      # Not fail-fast: when the two kernels disagree, the interesting
      # information is which one broke, and cancelling the other hides it.
      fail-fast: false
      matrix:
        kernel:
          - label: portable SIMD
            flags: "--disable-default-traits"
            marker: "matrix kernel: portable SIMD"
          - label: Accelerate
            flags: ""
            marker: "matrix kernel: Accelerate (cblas_sgemm)"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch en_core_web_sm 3.7.1
        run: |
          curl -sSL -o model.whl \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl
          unzip -q model.whl -d model
          echo "SPACY_MODEL_DIR=$PWD/model/en_core_web_sm/en_core_web_sm-3.7.1" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -o pipefail
          swift test -c release ${{ matrix.kernel.flags }} \
            --filter "NERTests|ParserTests|TaggerTests|RuleLemmatizerTests|MatrixKernelTests" \
            2>&1 | tee ner.log

      - name: Assert the expected kernel was compiled in
        # Without this, a typo in the trait name would leave this column running
        # the portable kernel and reporting a pass -- two identical jobs wearing
        # different names, which is worse than not having the second one.
        run: |
          grep -qF "${{ matrix.kernel.marker }}" ner.log \
            || { echo "::error::expected '${{ matrix.kernel.marker }}'"; exit 1; }

      - name: Fetch the de, es, fr, it, pt, ru and uk models (3.7.0)
        # One step rather than three, and a loop rather than three copies: the
        # only thing that varies is the language code. Each corpus is pinned to
        # 3.7.0 -- a different patch release has different weights and reads as
        # a catastrophic regression when it is only version skew.
        run: |
          for lang in de es fr it pt ru uk; do
            model="${lang}_core_news_sm-3.7.0"
            curl -sSL -o "$lang.whl" \
              "https://github.com/explosion/spacy-models/releases/download/${model}/${model}-py3-none-any.whl"
            unzip -q "$lang.whl" -d "${lang}model"
            upper=$(echo "$lang" | tr '[:lower:]' '[:upper:]')
            echo "SPACY_${upper}_MODEL_DIR=$PWD/${lang}model/${lang}_core_news_sm/${model}" \
              >> "$GITHUB_ENV"
          done

      - name: Non-English parity (de, es, fr, it, pt, ru, uk)
        # Three languages, each differing from English somewhere: their own
        # tokenizer rules, their own tag sets, 18 NER transition classes instead
        # of 74, and -- for German and Italian -- a *neural* edit-tree
        # lemmatizer where English has rules. Only that lemmatizer needed new
        # code; the rest needed the English constants taken out.
        #
        # Spanish is deliberately thinner: `es_core_news_sm` has no tagger at
        # all (POS comes from a morphologizer this port does not read) and uses
        # a bespoke `SpanishLemmatizer` rather than edit trees. `SpanishGapTests`
        # asserts both absences, so the gap fails loudly if someone assumes it
        # closed.
        run: |
          set -o pipefail
          swift test -c release ${{ matrix.kernel.flags }} \
            --filter "German|Spanish|Italian|Cyrillic|Russian|Ukrainian|CombiningMark|French|Portuguese|Romance|InlineFlag|MultilingualParser" \
            2>&1 | tee languages.log

      - name: Assert the per-language suites actually ran
        # Greps for the *measurements*, not the suite names. swift-testing
        # prints `Suite "spaCy German tagger parity" skipped.` when the model
        # directory is unset -- which contains the suite name, so a name grep
        # passes on a skipped suite and reports success for a job that measured
        # nothing. That is how the English NER suite once ran nowhere for
        # months, and the first version of this step reproduced the bug exactly.
        #
        # The counts themselves are not pinned here -- the suites already assert
        # them, and duplicating the numbers in CI would just mean a growing
        # corpus breaks the build in two places. The colon is the discriminator:
        # only the print statement emits it, so it cannot match a skip.
        run: |
          for line in \
            "German tokenizer: " \
            "German tagger: " \
            "German lemmas: " \
            "German NER parity: " \
            "Spanish tokenizer: " \
            "Spanish NER parity: " \
            "Italian tokenizer: " \
            "Italian tagger: " \
            "Italian lemmas: " \
            "Italian NER parity: " \
            "Russian tokenizer: " \
            "Russian NER parity: " \
            "Ukrainian tokenizer: " \
            "Ukrainian NER parity: " \
            "French tokenizer: " \
            "French NER parity: " \
            "French NER parity (with boundaries): " \
            "Portuguese tokenizer: " \
            "Portuguese lemmas: " \
            "Portuguese NER parity: " \
            "de sentence boundaries: " \
            "es sentence boundaries: " \
            "fr sentence boundaries: " \
            "it sentence boundaries: " \
            "pt sentence boundaries: " \
            "ru sentence boundaries: " \
            "uk sentence boundaries: "; do
            grep -qF "$line" languages.log \
              || { echo "::error::no measurement emitted for '$line'"; exit 1; }
          done

      - name: Assert the suite actually ran
        # A --filter that matches nothing exits 0. Without this, deleting the
        # suite or mistyping the filter would look like a pass -- which is
        # exactly how the gap this job closes went unnoticed.
        run: |
          grep -qE "Test run with [1-9][0-9]* test" ner.log \
            || { echo "::error::NER suite did not run"; exit 1; }
          grep -q "spaCy NER parity" ner.log \
            || { echo "::error::NER parity suite was skipped"; exit 1; }
          grep -q "spaCy tagger parity" ner.log \
            || { echo "::error::tagger parity suite was skipped"; exit 1; }
          grep -q "spaCy POS and lemma parity" ner.log \
            || { echo "::error::lemma parity suite was skipped"; exit 1; }
          # The parser is what makes NER exact rather than nearly exact, so a
          # skipped parser suite alongside a green NER suite would mean the NER
          # numbers came from somewhere other than the shipped configuration.
          grep -q "Parser parity: " ner.log \
            || { echo "::error::parser parity suite did not measure"; exit 1; }

  # ThreadSanitizer cannot load on the macOS dev host (Xcode's sanitizer
  # dylib fails the platform code-signature policy), so the race check lives
  # here. Scoped to the concurrency suite to keep it quick.
  thread-sanitizer:
    name: ThreadSanitizer (concurrency suite)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Test under TSan
        run: swift test --sanitize=thread --filter ConcurrencyTests

  # Not a supported target yet -- a canary. PresidioCore is stdlib-only, so it
  # should build and pass on Linux from day one. Catching portability drift the
  # week it lands is far cheaper than discovering it during the Android port.
  linux-canary:
    name: Linux canary (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        # No `set -o pipefail` here, unlike the macOS jobs: this one runs in a
        # container whose default shell is `sh`, where pipefail is not a valid
        # option and the step dies before running a single test. Redirect and
        # check the status explicitly instead.
        run: |
          swift test > linux.log 2>&1 || status=$?
          cat linux.log
          exit ${status:-0}

      - name: Assert the default build off Apple falls back
        # PresidioAccelerate is a *default* trait, so it is enabled here too --
        # the second half of its guard, `canImport(Accelerate)`, is the only
        # thing keeping this platform on the portable kernel. That is a claim
        # about a conditional nobody can evaluate by reading it, so it gets run.
        run: |
          grep -q "matrix kernel: portable SIMD" linux.log \
            || { echo "::error::Linux did not fall back to the portable kernel"; exit 1; }
